<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live GPS Location & Radar Map • 108 Emergency Dispatch</title>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0B1120;
      color: #F8FAFC;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      background: #0F172A;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: #DC2626;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .brand-text p {
      font-size: 10px;
      color: #10B981;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #34D399;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Map Viewport */
    #map-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: #090D16;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #090D16;
    }

    /* Pulsing Live Marker */
    .pulsing-gps-marker {
      position: relative;
      width: 24px;
      height: 24px;
    }

    .core-dot {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 16px;
      height: 16px;
      background: #10B981;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.9);
      z-index: 2;
    }

    .sonar-ring {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 36px;
      height: 36px;
      background: rgba(16, 185, 129, 0.4);
      border-radius: 50%;
      animation: sonar 1.8s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 1;
    }

    @keyframes sonar {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Telemetry HUD Floating Card */
    .telemetry-card {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .coords-title {
      font-size: 11px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .coords-value {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
    }

    .accuracy-pill {
      font-size: 11px;
      background: #1E293B;
      padding: 4px 8px;
      border-radius: 6px;
      color: #38BDF8;
      font-weight: 600;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-fetch {
      background: #10B981;
      color: #FFFFFF;
    }

    .btn-fetch:hover {
      background: #059669;
    }

    .btn-app {
      background: #DC2626;
      color: #FFFFFF;
      text-decoration: none;
    }

    .btn-app:hover {
      background: #B91C1C;
    }

    .prompt-banner {
      background: #1E293B;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: #CBD5E1;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🚑</div>
      <div class="brand-text">
        <h1>LIVE GPS TELEMETRY</h1>
        <p>108 Rapid Emergency Dispatch</p>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="pulse-dot"></div>
      <span id="statusText">GPS Ready</span>
    </div>
  </header>

  <div id="map-container">
    <div id="map"></div>

    <div class="telemetry-card">
      <div class="prompt-banner" id="permissionPrompt">
        <span>📍</span>
        <span id="promptText">Click <b>"Fetch Live Location"</b> to prompt for device GPS and center map.</span>
      </div>

      <div class="telemetry-row">
        <div>
          <div class="coords-title">Coordinates</div>
          <div class="coords-value" id="coordsText">13.0827° N, 80.2707° E</div>
        </div>
        <div class="accuracy-pill" id="accuracyPill">Accuracy: ±10m</div>
      </div>

      <div class="action-buttons">
        <button class="btn-fetch" id="btnFetch" onclick="handleFetchClick()">
          <span>🎯</span> FETCH LIVE LOCATION
        </button>
        <button class="btn-app" onclick="window.location.href='/'">
          <span>🚑</span> LAUNCH 108 APP
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="emergency_stream.js"></script>

  <script>
    // Initialize Leaflet Map centered on Chennai Central by default
    var defaultLat = 13.0827;
    var defaultLng = 80.2707;
    var currentMarker = null;
    var currentCircle = null;

    var map = L.map('map', {
      zoomControl: true
    }).setView([defaultLat, defaultLng], 14);

    // Dark Tactical Tile Layer (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> | 108 Emergency Systems',
      maxZoom: 19
    }).addTo(map);

    // Initial Marker
    function addOrUpdateMarker(lat, lng, accuracy) {
      if (currentMarker) {
        currentMarker.setLatLng([lat, lng]);
      } else {
        var userIcon = L.divIcon({
          className: 'user-pin-wrapper',
          html: '<div class="pulsing-gps-marker"><div class="core-dot"></div><div class="sonar-ring"></div></div>',
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        currentMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
      }

      if (currentCircle) {
        currentCircle.setLatLng([lat, lng]);
        currentCircle.setRadius(accuracy || 15);
      } else {
        currentCircle = L.circle([lat, lng], {
          radius: accuracy || 15,
          color: '#10B981',
          fillColor: '#10B981',
          fillOpacity: 0.15,
          weight: 1.5
        }).addTo(map);
      }
    }

    addOrUpdateMarker(defaultLat, defaultLng, 25);

    /**
     * Exact JavaScript function requested by user:
     * Calls navigator.geolocation.getCurrentPosition, prompts for permission,
     * passes latitude & longitude to map's setCenter method, and adds marker to visualize.
     */
    function fetchLiveLocation(mapInstance) {
      var badge = document.getElementById('statusText');
      var prompt = document.getElementById('promptText');
      var coordsEl = document.getElementById('coordsText');
      var accEl = document.getElementById('accuracyPill');

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      badge.textContent = "Acquiring GPS...";
      prompt.innerHTML = "📡 Querying device GPS satellites & Wi-Fi triangulation...";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          var accuracy = position.coords.accuracy || 10;
          var userLocation = { lat: lat, lng: lng };

          // 1. Pass coordinates to map.setCenter method
          if (mapInstance && typeof mapInstance.setCenter === 'function') {
            mapInstance.setCenter(userLocation);
          } else if (mapInstance && typeof mapInstance.setView === 'function') {
            mapInstance.setView([lat, lng], 17);
          }

          // 2. Add/update marker to visualize user's position
          addOrUpdateMarker(lat, lng, accuracy);

          // Update HUD
          coordsEl.textContent = lat.toFixed(5) + "° N, " + lng.toFixed(5) + "° E";
          accEl.textContent = "Accuracy: ±" + Math.round(accuracy) + "m";
          badge.textContent = "GPS Locked (100%)";
          prompt.innerHTML = "✅ Live position acquired! Paramedic tracking locked to this coordinate.";

          // Store for Flutter App
          if (window.EmergencyStream) {
            window.EmergencyStream.lastLiveLocation = {
              latitude: lat,
              longitude: lng,
              accuracy: accuracy,
              timestamp: Date.now()
            };
          }
        },
        function (error) {
          console.error("GPS Acquisition Error:", error);
          badge.textContent = "GPS Denied / Timeout";
          prompt.innerHTML = "⚠️ Permission was denied or timed out (" + error.message + "). Defaulting to Central.";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function handleFetchClick() {
      fetchLiveLocation(map);
    }

    // Auto-prompt on load
    window.addEventListener('DOMContentLoaded', function() {
      fetchLiveLocation(map);
    });
  </script>
</body>
</html>
